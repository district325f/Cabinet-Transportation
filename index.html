<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabinet Schooling - Transportation Management</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            --secondary-color: #2563eb;
            --accent-color: #3b82f6;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-color: #334155;
            --border-color: #e2e8f0;
            --focus-ring: rgba(37, 99, 235, 0.2);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background-color);
            background-image: radial-gradient(#e2e8f0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: var(--text-color);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .form-container {
            background-color: var(--card-background);
            padding: 40px 32px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.03), 0 0 1px 0 rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
        }

        @media (max-width: 480px) {
            .form-container {
                padding: 24px 20px;
                border-radius: 16px;
            }
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            position: relative;
        }

        .header h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .header h2 {
            color: #64748b;
            margin: 6px 0 0 0;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header h3 {
            margin: 14px 0 0 0;
            font-size: 14px;
            color: #1d4ed8;
            background: #eff6ff;
            display: inline-block;
            padding: 6px 18px;
            border-radius: 9999px;
            font-weight: 600;
            border: 1px solid #dbeafe;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.04);
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
            font-size: 14.5px;
        }

        .required {
            color: #ef4444;
            margin-left: 3px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 15px;
            color: #0f172a;
            background-color: #f8fafc;
            box-sizing: border-box;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--secondary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        input[type="text"]::placeholder {
            color: #94a3b8;
        }

        .conditional-section {
            display: none;
            background-color: #f1f5f9;
            padding: 20px;
            border-left: 4px solid var(--secondary-color);
            border-radius: 12px;
            margin-top: 16px;
            box-sizing: border-box;
            animation: slideDown 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .submit-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.2), 0 2px 4px -1px rgba(30, 58, 138, 0.1);
            transition: all 0.2s ease;
            margin-top: 12px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(30, 58, 138, 0.25), 0 4px 6px -4px rgba(30, 58, 138, 0.15);
        }

        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .note-box {
            margin-top: 28px;
            padding: 16px 20px;
            background-color: #fefce8;
            border: 1px solid #fef08a;
            border-left: 4px solid #eab308;
            border-radius: 12px;
            font-size: 14.5px;
            line-height: 1.6;
            color: #451a03;
        }

        .note-title {
            font-weight: 700;
            color: #854d0e;
            margin-bottom: 6px;
        }

        .highlight-time {
            font-weight: 700;
            color: #b91c1c;
            background-color: #fee2e2;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid #fca5a5;
            display: inline-block;
            margin: 0 2px;
        }

        /* फोटो जस्तै हुबहु म्यासेजको डिजाइन */
        .already-submitted {
            text-align: center;
            padding: 40px 10px 20px 10px;
            color: #1e3a8a;
            animation: fadeIn 0.4s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .already-submitted h2 {
            font-size: 24px;
            color: #dc2626;
            margin-bottom: 16px;
            font-weight: 700;
        }
        
        .already-submitted p {
            font-size: 16px;
            line-height: 1.6;
            color: #334155;
            margin-bottom: 8px;
        }
        
        a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.15s ease;
        }
        a:hover {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .footer-credit {
            margin-top: 36px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }
        
        .footer-credit a {
            color: #1877f2;
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h1>Cabinet Schooling</h1>
        <h2>2026-2027</h2>
        <h3>Transportation Management</h3>
    </div>

    <div id="formBody">
        <form id="transportForm" onsubmit="handleSubmit(event)">
            <div class="form-group">
                <label for="fullName">तपाईँको नाम: <span class="required">*</span></label>
                <input type="text" id="fullName" placeholder="पुरा नाम लेख्नुहोस्" required>
            </div>

            <div class="form-group">
                <label for="designation">पद: <span class="required">*</span></label>
                <input type="text" id="designation" placeholder="तपाईँको पद" required>
            </div>

            <div class="form-group">
                <label for="contactNo">सम्पर्क नं.: <span class="required">*</span></label>
                <input type="text" id="contactNo" placeholder="मोबाइल नम्बर" pattern="[0-9]{10}" title="कृपया १० अंकको मोबाइल नम्बर राख्नुहोस्" required>
            </div>

            <div class="form-group">
                <label for="needTransport">स्कुलिङमा जान यातायातको आवश्यकता छ ? <span class="required">*</span></label>
                <select id="needTransport" onchange="toggleLocationSelect()" required>
                    <option value="" disabled selected>--- छनौट गर्नुहोस् ---</option>
                    <option value="yes">छ</option>
                    <option value="no">छैन</option>
                </select>
            </div>

            <div class="form-group conditional-section" id="locationGroup">
                <label for="locationSelect">कृपया आफूलाई यातायातको सुविधाको लागि पायक पर्ने स्थान छनौट गर्नुहोस्: <span class="required">*</span></label>
                <select id="locationSelect" onchange="updateNote()">
                    <option value="" disabled selected>--- स्थान छनौट गर्नुहोस् ---</option>
                    <option value="आराधना पेट्रोल पम्प, सिफल" data-time="६:४५ बजे">आराधना पेट्रोल पम्प, सिफल</option>
                    <option value="नयाँ बानेश्वर चोक" data-time="७:०० बजे">नयाँ बानेश्वर चोक</option>
                    <option value="कोटेश्वर चोक" data-time="७:१५ बजे">कोटेश्वर चोक</option>
                    <option value="सातदोबाटो चोक" data-time="७:३० बजे">सातदोबाटो चोक</option>
                </select>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">विवरण बुझाउनुहोस्</button>
        </form>

        <div class="note-box" id="infoNote">
            <div class="note-title">* पुनश्च:</div>
            <span id="dynamicNoteText">कृपया फारम भर्नुहोस् । तपाईँले छनौट गर्नुभएको स्थानको आधारमा यहाँ समय र सम्पर्क विवरण देखापर्नेछ ।</span>
        </div>
    </div>

    <div class="footer-credit">
        Design by: <a href="https://facebook.com/nirajan.aryal.92" target="_blank">Nirajan Aryal</a><br>
        📞 <a href="tel:9851113811">9851113811</a>
    </div>
</div>

<script>
    function showAlreadySubmittedMessage() {
        document.getElementById('formBody').innerHTML = `
            <div class="already-submitted">
                <h2>⚠️ विवरण अस्विकृत !</h2>
                <p>तपाईँको मोबाइल नम्बर वा यो डिभाइसबाट विवरण पहिले नै बुझाइसकिएको छ।</p>
                <p style="font-size:14px; color:#64748b; margin-top:24px;">यदि केही विवरण सच्याउनु पर्ने भएमा व्यवस्थापकलाई सम्पर्क गर्नुहोला।</p>
            </div>
        `;
    }

    function toggleLocationSelect() {
        const needTransport = document.getElementById('needTransport').value;
        const locationGroup = document.getElementById('locationGroup');
        const locationSelect = document.getElementById('locationSelect');
        
        if (needTransport === 'yes') {
            locationGroup.style.display = 'block';
            locationSelect.required = true;
        } else {
            locationGroup.style.display = 'none';
            locationSelect.required = false;
            locationSelect.value = '';
        }
        updateNote();
    }

    function updateNote() {
        const needTransport = document.getElementById('needTransport').value;
        const locationSelect = document.getElementById('locationSelect');
        const noteText = document.getElementById('dynamicNoteText');
        
        if (needTransport === 'no') {
            noteText.innerHTML = "तपाईँले यातायातको आवश्यकता पर्दैन भनी छनौट गर्नुभएको छ । धन्यवाद !";
            return;
        }

        if (locationSelect.value) {
            const selectedOption = locationSelect.options[locationSelect.selectedIndex];
            const locationName = selectedOption.text;
            const routeTime = selectedOption.getAttribute('data-time');
            
            noteText.innerHTML = `कृपया आफुले छनौट गरेको स्थान <strong>"${locationName}"</strong> मा तोकिएको समय <span class="highlight-time">${routeTime}</span> मेला भईदिनुहुन अनुरोध गर्दछौँ । साथै यातायात सम्बन्धि थप जानकारीका लागि <strong>लायन मोहन अर्याल (<a href="tel:9851165500">9851165500</a>)</strong> लाई सम्पर्क गर्नुहोला ।`;
        } else {
            noteText.innerHTML = "कृपया आफूलाई पायक पर्ने स्थान छनौट गर्नुहोस् । त्यसपछि यहाँ तोकिएको समय तालिका उपलब्ध हुनेछ ।";
        }
    }

    function handleSubmit(event) {
        event.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const originalBtnText = submitBtn.innerText;
        submitBtn.innerText = "जाँच गरिँदैछ...";
        submitBtn.disabled = true;

        const fullName = document.getElementById('fullName').value;
        const designation = document.getElementById('designation').value;
        const contactNo = document.getElementById('contactNo').value;
        const needTransport = document.getElementById('needTransport').value;
        
        let locationName = "आवश्यकता पर्दैन";
        let routeTime = "-";
        
        if (needTransport === 'yes') {
            const locationSelect = document.getElementById('locationSelect');
            const selectedOption = locationSelect.options[locationSelect.selectedIndex];
            locationName = selectedOption.text;
            routeTime = selectedOption.getAttribute('data-time');
        }

        // ⚠️ स्टेप २ बाट कपी गर्नुभएको नयाँ Deployment URL यहाँ हाल्नुहोस्
        const googleWebAppUrl = "https://script.google.com/macros/s/AKfycbwPgKJ0q4kZKkkyHzj4MkEim6W9x3uY6gTmDblBG9hRUjPvzyZY-eQuu3lYIwKw6WU/exec"; 

        const formData = {
            fullName: fullName,
            designation: designation,
            contactNo: contactNo,
            location: needTransport === 'yes' ? locationName + " (" + routeTime + ")" : "आवश्यकता छैन"
        };

        // सिट ब्याकइन्डमा पठाएर जाँच गर्ने
        fetch(googleWebAppUrl, {
            method: 'POST',
            body: JSON.stringify(formData)
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === "duplicate") {
                // यदि नम्बर पहिले नै सिटमा उपलब्ध छ भने ह्वाट्सएप विन्डो नखोली सिधै ब्लक स्क्रिन देखाउने
                showAlreadySubmittedMessage();
            } else {
                // यदि नम्बर नयाँ छ भने मात्र ह्वाट्सएप खुल्ने
                let whatsappMessage = `नमस्ते लायन मोहन अर्याल ज्यू,\n\n`;
                whatsappMessage += `*Cabinet Schooling (2026-2027)*\n`;
                whatsappMessage += `*Transportation Management Details*\n\n`;
                whatsappMessage += `👤 *नाम:* ${fullName}\n`;
                whatsappMessage += `🎖️ *पद:* ${designation}\n`;
                whatsappMessage += `📞 *सम्पर्क नं:* ${contactNo}\n`;
                whatsappMessage += `🚌 *यातायात आवश्यक:* ${needTransport === 'yes' ? 'छ' : 'छैन'}\n`;
                
                if (needTransport === 'yes') {
                    whatsappMessage += `📍 *भेला हुने स्थान:* ${locationName}\n`;
                    whatsappMessage += `⏰ *समय:* ${routeTime}\n`;
                }

                const targetNumber = "9779851165500";
                const whatsappUrl = `https://api.whatsapp.com/send?phone=${targetNumber}&text=${encodeURIComponent(whatsappMessage)}`;
                
                window.open(whatsappUrl, '_blank');
                
                // फारम क्लियर गर्ने
                document.getElementById('transportForm').reset();
                toggleLocationSelect();
                submitBtn.innerText = originalBtnText;
                submitBtn.disabled = false;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            submitBtn.innerText = originalBtnText;
            submitBtn.disabled = false;
            alert("सर्भरसँग कनेक्सन हुन सकेन। कृपया पुनः प्रयास गर्नुहोला।");
        });
    }
</script>

</body>
</html>
